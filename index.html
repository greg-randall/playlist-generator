<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playlist Generator</title>
<style>
  :root { --bg:#121212; --panel:#181818; --line:#282828; --text:#e8e8e8;
          --muted:#9a9a9a; --green:#1db954; --red:#e0554e; --orange:#e0a44e; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; height:100vh; }
  header { padding:16px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:18px; font-weight:700; }
  header p { margin:4px 0 0; color:var(--muted); font-size:12px; }
  .bar { display:flex; align-items:center; gap:10px; padding:10px 20px 0; background:var(--panel); }
  .modes { display:flex; gap:4px; }
  .mode { background:transparent; color:var(--muted); border-radius:8px 8px 0 0;
          padding:8px 14px; border-bottom:2px solid transparent; }
  .mode.active { color:var(--text); border-bottom-color:var(--green); }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:end;
              padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  .field.grow { flex:1 1 320px; }
  .source { flex:1 1 100%; display:flex; gap:10px; align-items:end; }
  textarea { background:#0e0e0e; border:1px solid var(--line); color:var(--text);
             border-radius:6px; padding:8px 10px; resize:vertical; width:100%;
             font:12.5px/1.5 SFMono-Regular,Menlo,monospace; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  input[type=text], input[type=number] { background:#0e0e0e; border:1px solid var(--line);
    color:var(--text); border-radius:6px; padding:8px 10px; font-size:14px; }
  input[type=text] { min-width:200px; }
  input[type=number] { width:80px; }
  .checks { display:flex; gap:14px; align-items:center; }
  .checks label { font-size:13px; color:var(--text); text-transform:none; letter-spacing:0; }
  button { border:none; border-radius:20px; padding:9px 18px; font-size:14px;
           font-weight:600; cursor:pointer; }
  .primary { background:var(--green); color:#000; }
  .secondary, #stop { background:#333; color:var(--text); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .status { margin-left:auto; font-size:13px; color:var(--muted); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%;
         background:var(--muted); margin-right:6px; vertical-align:middle; }
  .dot.running { background:var(--green); animation:pulse 1s infinite; }
  .dot.error { background:var(--red); } .dot.complete { background:var(--green); }
  .dot.stopped { background:var(--orange); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  main { display:grid; grid-template-columns:1fr 380px; gap:0; flex:1; min-height:0; }
  @media (max-width:820px){ body{ height:auto; min-height:100vh; }
                            main{ grid-template-columns:1fr; } }
  #console { overflow:auto; padding:14px 18px; font:12.5px/1.6 SFMono-Regular,Menlo,monospace;
             white-space:pre-wrap; word-break:break-word; }
  #console .added, #console .found { color:var(--green); }
  #console .miss   { color:var(--orange); }
  #console .error  { color:var(--red); }
  #console .below, #console .duplicate { color:var(--muted); }
  #console .tempo { color:var(--text); }
  #console .auth { color:var(--orange); }
  #console .search, #console .progress, #console .reorder, #console .summary, #console .done,
  #console .playlist { color:#7fbfff; }
  #needs { padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  #needs h3 { margin:0 0 8px; font-size:13px; }
  #needs .need { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:4px 0; }
  #needs .need .name { flex:1 1 260px; }
  #needs .need .why { color:var(--orange); font-size:12px; }
  #needs button.pick { background:#2a2a2a; color:var(--text); padding:4px 12px; font-size:12px; }
  #needs .actions { display:flex; gap:10px; align-items:center; margin-top:10px; }
  #needs .actions span { color:var(--muted); font-size:12px; }
  #needs h3.keys { margin-top:14px; }
  #needs input.key { width:110px; }
  #keyRows { max-height:260px; overflow-y:auto; }
  aside { border-left:1px solid var(--line); background:var(--panel); padding:14px;
          display:flex; flex-direction:column; gap:10px; }
  aside .head { display:flex; align-items:center; justify-content:space-between; }
  aside h2 { margin:0; font-size:13px; text-transform:uppercase; color:var(--muted); letter-spacing:.04em; }
  aside button.refresh { background:#2a2a2a; color:var(--text); padding:4px 10px; font-size:12px; border-radius:14px; }
  .player-state { color:var(--muted); font-size:13px; text-align:center; padding:44px 16px;
                  border:1px dashed var(--line); border-radius:12px; display:flex;
                  flex-direction:column; align-items:center; gap:12px; line-height:1.5; }
  .player-state .icon { font-size:30px; opacity:.85; }
  .spinner { width:26px; height:26px; border:3px solid var(--line); border-top-color:var(--green);
             border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  iframe { border:0; border-radius:12px; width:100%; height:420px; }
</style>
</head>
<body>
<header>
  <h1>🎵 Playlist Generator</h1>
  <p>Give a term, watch songs get matched by their lyrics, and hear the playlist build.</p>
</header>

<div class="bar">
  <div class="modes">
    <button class="mode active" id="modeSearch">Search lyrics</button>
    <button class="mode" id="modeList">Track list</button>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">idle</span></div>
  <button id="stop" disabled>⏹ Stop</button>
</div>

<div class="controls" id="searchControls">
  <div class="field">
    <label for="query" title="Comma-separate several terms; each is searched, all are matched">Search terms</label>
    <input type="text" id="query" placeholder="e.g. kristen, kristin, bonds, pocket" value="">
  </div>
  <div class="field">
    <label for="title">Playlist title</label>
    <input type="text" id="title" placeholder="(defaults to the term)">
  </div>
  <div class="field">
    <label for="threshold">Threshold %</label>
    <input type="number" id="threshold" value="3.0" step="0.1" min="0">
  </div>
  <div class="field">
    <label title="Where to look for songs. Saved lyrics needs no lyric lookups at all.">Discover with</label>
    <div class="checks">
      <label><input type="checkbox" id="saved" checked> Saved lyrics</label>
      <label><input type="checkbox" id="spotify" checked> Spotify search</label>
      <label><input type="checkbox" id="genius" checked> Genius search</label>
    </div>
  </div>
  <button id="start" class="primary go">▶ Start</button>
</div>

<div class="controls" id="listControls" hidden>
  <div class="source">
    <div class="field grow">
      <label for="sourceLink" title="Loads that playlist's tracks into the box below, in order, so you can rearrange them">Start from an existing playlist (optional)</label>
      <input type="text" id="sourceLink" placeholder="Paste a Spotify playlist link">
    </div>
    <button id="loadList" class="secondary">Load tracks</button>
  </div>
  <div class="field grow">
    <label for="tracks" title="Artist - Title works too; numbering and blank lines are ignored">Tracks, one per line, in the order you want</label>
    <textarea id="tracks" rows="6" placeholder="Title - Artist&#10;Title - Artist&#10;..."></textarea>
  </div>
  <div class="field">
    <label for="listTitle">Playlist title</label>
    <input type="text" id="listTitle" placeholder="e.g. Bike ride">
  </div>
  <button id="createList" class="primary go">▶ Create playlist</button>
  <button id="checkList" class="secondary go" title="Look the tracks up without creating a playlist">Check only</button>
  <button id="reorderList" class="secondary go" title="Put the tracks in an order that flows by tempo and key. Changes only the box above, nothing on Spotify">Reorder by tempo + key</button>
</div>

<div id="needs" hidden>
  <h3 id="needsTitle"></h3>
  <div id="needsRows"></div>
  <h3 id="keysTitle" class="keys" hidden></h3>
  <div id="keyRows"></div>
  <div class="actions">
    <button id="applyTempos" class="primary go">Reorder again</button>
    <button id="undoReorder" class="secondary">Undo reorder</button>
    <button id="forgetTempos" class="secondary" title="Clear every tempo and key you have typed in">Forget my tempos and keys</button>
    <span id="temposNote"></span>
  </div>
</div>

<main>
  <div id="console"></div>
  <aside>
    <div class="head">
      <h2>Spotify Player</h2>
      <button class="refresh" id="refresh" disabled>↻ refresh</button>
    </div>
    <div id="playerWrap"></div>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
let cursor = 0, polling = null, playlistId = null, playerMounted = false;
let emptyState = "empty";  // which player message to show if a run ends with no playlist
const known = {};          // line -> Spotify track id, for tracks loaded from a playlist
let beforeReorder = null;  // the box's text before the last reorder, for Undo

// Tempos you typed in for tracks the services don't know, kept in this browser.
const tempoKey = (text) => text.toLowerCase().split(/\s+/).filter(Boolean).join(" ");
function loadTempos() {
  try { return JSON.parse(localStorage.getItem("tempos") || "{}") || {}; } catch (e) { return {}; }
}
function saveTempos(tempos) {
  try { localStorage.setItem("tempos", JSON.stringify(tempos)); } catch (e) { /* still works this run */ }
}
let myTempos = loadTempos();

// Keys you typed in ("8A", "A minor", "Am"...), kept in this browser the same way.
function loadKeys() {
  try { return JSON.parse(localStorage.getItem("keys") || "{}") || {}; } catch (e) { return {}; }
}
function saveKeys(keys) {
  try { localStorage.setItem("keys", JSON.stringify(keys)); } catch (e) { /* still works this run */ }
}
let myKeys = loadKeys();

const PLAYER_STATES = {
  idle: '<div class="player-state"><div class="icon">🎧</div>'
      + '<div>Your playlist player appears here.<br>Hit <b>Start</b> to begin.</div></div>',
  warming: '<div class="player-state"><div class="spinner"></div>'
      + '<div>Building your playlist…<br>the player loads when the first track lands.</div></div>',
  empty: '<div class="player-state"><div class="icon">🕳️</div>'
      + '<div>No songs were added.<br>Try a lower threshold or another term.</div></div>',
  noPlaylist: '<div class="player-state"><div class="icon">📋</div>'
      + '<div>No playlist was created.<br>See the console for what was found.</div></div>',
};
function renderPlayer(state) { $("playerWrap").innerHTML = PLAYER_STATES[state]; }

function setStatus(s) {
  $("statusText").textContent = s;
  $("dot").className = "dot " + (["running","complete","stopped","error"].includes(s) ? s : "");
}

// ---- Debug output in the browser's devtools console (F12 > Console) ----------
// Logs everything: every request the page makes (with its body and answer), every record
// the server keeps while it works (outbound HTTP calls, database calls, library logs,
// printed lines), every run event, every click and field change, storage writes, and
// errors. Secrets are masked on the server; the page never sees tokens.
// Helpers: window.debugState() (page state), window.runDebug (this run's record),
// window.debugVerbose = true (also log each 0.4s poll).
window.debugVerbose = false;
const COLORS = {error:"#ff6b6b", miss:"#ffa94d", added:"#51cf66", found:"#51cf66",
                duplicate:"#868e96", below:"#868e96", tempo:"#e9ecef", done:"#7fbfff", auth:"#ffa94d"};
const CATEGORY_COLORS = {http:"#4dabf7", db:"#b197fc", log:"#ffd43b", print:"#adb5bd", app:"#69db7c"};
let runDebug = {url: "(page)", body: null, startedAt: performance.now(), events: [], polls: 0, server: []};
window.runDebug = runDebug;
let serverDebug = {cursor: 0, generation: null};

const nativeFetch = window.fetch.bind(window);
const clock = (ms) => new Date(ms).toISOString().slice(11, 23);
function parseBody(body) {
  if (body === undefined || body === null) return undefined;
  if (typeof body !== "string") return "(" + Object.prototype.toString.call(body) + ")";
  try { return JSON.parse(body); } catch (e) { return body; }
}

// Print server-side records (http / db / log / print / app) as they arrive.
const seenServer = new Set();   // a record can arrive twice if two requests overlap; print it once
function printServerRecords(records) {
  records.forEach((rec) => {
    const id = rec.t + "|" + rec.cat + "|" + rec.msg;
    if (seenServer.has(id)) return;
    seenServer.add(id);
    runDebug.server.push(rec);
    // A 404 is a normal answer ("no lyrics for that song"), not a failure, so it is not flagged.
    const bad = (rec.ok === false && rec.status !== 404) || (rec.status && rec.status >= 400 && rec.status !== 404) ||
                rec.level === "ERROR" || rec.level === "CRITICAL";
    const warn = rec.level === "WARNING";
    const label = "%c[" + clock(rec.t * 1000) + "] server " + rec.cat + "%c " + rec.msg;
    const style = "color:" + (CATEGORY_COLORS[rec.cat] || "#adb5bd") + ";font-weight:bold";
    if (bad) { console.error(label, style, "", rec); return; }
    if (warn) { console.warn(label, style, "", rec); return; }
    console.groupCollapsed(label, style, "");
    console.log(rec);
    console.groupEnd();
  });
}

async function pullServerDebug() {
  try {
    const r = await nativeFetch("/api/debug?cursor=" + serverDebug.cursor +
      (serverDebug.generation === null ? "" : "&generation=" + serverDebug.generation));
    if (!r.ok) return;
    const data = await r.json();
    serverDebug = {cursor: data.debug_cursor, generation: data.generation};
    printServerRecords(data.debug || []);
  } catch (e) { /* the server is unreachable; the fetch wrapper already logged why */ }
}

// Every request the page makes, with the body it sent and the answer it got.
window.fetch = async function (input, init) {
  const url = typeof input === "string" ? input : (input && input.url) || String(input);
  const method = ((init && init.method) || (input && input.method) || "GET").toUpperCase();
  const isPoll = url.indexOf("/api/events") === 0 || url.indexOf("/api/debug") === 0;
  const requestBody = parseBody(init && init.body);
  const started = performance.now();
  try {
    const response = await nativeFetch(input, init);
    const ms = Math.round(performance.now() - started);
    if (!isPoll || window.debugVerbose || !response.ok) {
      const label = "%c[" + clock(Date.now()) + "] page " + method + " " + url + "%c -> " + response.status +
                    " " + response.statusText + " in " + ms + "ms";
      const style = "color:#4dabf7;font-weight:bold";
      response.clone().text().then((text) => {
        let answer = text;
        try { answer = JSON.parse(text); } catch (e) { /* not JSON: show the text */ }
        const group = response.ok ? console.groupCollapsed : console.group;
        group.call(console, label, style, response.ok ? "" : "color:#ff6b6b");
        if (requestBody !== undefined) console.log("request body", requestBody);
        console.log("answer", answer);
        console.log("headers", Object.fromEntries(response.headers.entries()));
        console.groupEnd();
      }).catch(() => {});
    }
    if (!isPoll) setTimeout(pullServerDebug, 0);   // what the server did to answer this
    return response;
  } catch (err) {
    console.error("[playlist] page " + method + " " + url + " failed before any answer (is the server up?)",
                  err, requestBody);
    throw err;
  }
};

function debugStart(url, body) {
  runDebug = {url: url, body: body, startedAt: performance.now(), events: [], polls: 0, server: []};
  window.runDebug = runDebug;
  serverDebug = {cursor: 0, generation: null};
  seenServer.clear();
  console.groupCollapsed("%c[playlist] run started: " + url, "color:#7fbfff;font-weight:bold");
  console.log("request body", body);
  console.groupEnd();
}

function debugEvent(ev) {
  const t = ((performance.now() - runDebug.startedAt) / 1000).toFixed(2) + "s";
  runDebug.events.push(Object.assign({t: t}, ev));
  const label = "%c[" + t + "] " + ev.kind + "%c " + (ev.message || "");
  const style = "color:" + (COLORS[ev.kind] || "#7fbfff") + ";font-weight:bold";
  const fields = Object.keys(ev).filter((k) => k !== "kind" && k !== "message");
  if (ev.kind === "error") { console.error(label, style, "", ev); return; }
  if (fields.length === 0) { console.log(label, style, "", ""); return; }
  console.groupCollapsed(label, style, "");
  console.table(ev);
  console.log("raw event", ev);
  console.groupEnd();
}

function debugSummary(status) {
  const seconds = ((performance.now() - runDebug.startedAt) / 1000).toFixed(1);
  const counts = {};
  runDebug.events.forEach((ev) => { counts[ev.kind] = (counts[ev.kind] || 0) + 1; });
  const hosts = {}, slow = [];
  runDebug.server.filter((r) => r.cat === "http").forEach((r) => {
    let host = r.url; try { host = new URL(r.url).host; } catch (e) { /* keep the raw url */ }
    const h = hosts[host] || (hosts[host] = {calls: 0, errors: 0, total_ms: 0});
    h.calls++; h.total_ms += r.ms || 0; if (r.ok === false) h.errors++;
    slow.push({ms: r.ms, call: r.method + " " + r.url, status: r.status || r.error});
  });
  const db = runDebug.server.filter((r) => r.cat === "db");
  console.group("%c[playlist] run " + (status || "finished") + " in " + seconds + "s ("
                + runDebug.events.length + " events, " + runDebug.polls + " polls, "
                + runDebug.server.length + " server records)", "color:#7fbfff;font-weight:bold");
  console.log("events by kind"); console.table(counts);
  if (Object.keys(hosts).length) { console.log("outbound HTTP by host"); console.table(hosts); }
  if (slow.length) { console.log("slowest outbound calls"); console.table(slow.sort((a, b) => b.ms - a.ms).slice(0, 10)); }
  if (db.length) console.log("database calls: " + db.length + ", " + db.reduce((n, r) => n + (r.ms || 0), 0) + "ms total");
  console.log("everything: window.runDebug.events and window.runDebug.server");
  console.groupEnd();
}

// What you do on the page: clicks, field changes (typing is logged once you pause), tabs.
function describe(el) {
  if (!el || !el.tagName) return String(el);
  const text = (el.innerText || el.value || "").replace(/\s+/g, " ").trim();
  return el.tagName.toLowerCase() + (el.id ? "#" + el.id : "") +
         (el.className && typeof el.className === "string" ? "." + el.className.split(" ").join(".") : "") +
         (text && el.tagName !== "TEXTAREA" ? ' "' + text.slice(0, 60) + '"' : "");
}
document.addEventListener("click", (e) => {
  const target = e.target.closest("button, a, input, label, select, [onclick]") || e.target;
  console.log("%c[" + clock(Date.now()) + "] click%c " + describe(target), "color:#69db7c;font-weight:bold", "");
}, true);
const typingTimers = new WeakMap();
function logField(el) {
  const value = el.type === "checkbox" ? el.checked
              : el.tagName === "TEXTAREA" ? {lines: el.value.split("\n").filter(Boolean).length, chars: el.value.length}
              : el.value;
  console.log("%c[" + clock(Date.now()) + "] field%c " + describe(el) + " =", "color:#69db7c;font-weight:bold", "", value);
}
document.addEventListener("input", (e) => {
  const el = e.target;
  clearTimeout(typingTimers.get(el));
  typingTimers.set(el, setTimeout(() => logField(el), 600));
}, true);
document.addEventListener("change", (e) => { clearTimeout(typingTimers.get(e.target)); logField(e.target); }, true);

// Anything stored in this browser (the tempos and keys you typed in).
const nativeSetItem = Storage.prototype.setItem, nativeRemoveItem = Storage.prototype.removeItem;
Storage.prototype.setItem = function (key, value) {
  console.log("[playlist] storage set " + key + " (" + String(value).length + " chars)", parseBody(String(value)));
  return nativeSetItem.call(this, key, value);
};
Storage.prototype.removeItem = function (key) {
  console.log("[playlist] storage remove " + key);
  return nativeRemoveItem.call(this, key);
};

// Page errors that would otherwise go unnoticed.
window.addEventListener("error", (e) => console.error("[playlist] page error:", e.message, e.filename + ":" + e.lineno, e.error));
window.addEventListener("unhandledrejection", (e) => console.error("[playlist] unhandled promise rejection:", e.reason));

window.debugState = function () {
  const state = {cursor, polling: polling !== null, playlistId, playerMounted, emptyState,
                 knownTracks: Object.keys(known).length, known, myTempos, myKeys,
                 serverDebug, runUrl: runDebug.url, events: runDebug.events.length,
                 serverRecords: runDebug.server.length};
  console.log("[playlist] state", state);
  return state;
};

// At load: where we are, what's stored, and whether the server is reachable.
console.groupCollapsed("%c[playlist] page loaded", "color:#7fbfff;font-weight:bold");
console.log("location", location.href, "| online:", navigator.onLine, "| " + navigator.userAgent);
try {
  console.log("storage", Object.keys(localStorage).map((k) => k + ": " + (localStorage.getItem(k) || "").length + " chars"));
} catch (e) { console.log("storage unavailable", e); }
console.log("helpers: debugState(), runDebug, debugVerbose = true (log every poll)");
console.groupEnd();
setTimeout(pullServerDebug, 0);

function line(ev) {
  debugEvent(ev);
  const div = document.createElement("div");
  // 'evaluate' events color by verdict (below/match); others by kind.
  let cls = ev.kind;
  if (ev.kind === "evaluate") cls = ev.verdict === "MATCH" ? "added" : "below";
  div.className = cls;
  if (ev.kind === "auth" && ev.url) {
    // The login link, clickable in case the browser blocks the new tab.
    div.appendChild(document.createTextNode("Spotify needs you to log in. A new tab should open; "
                                            + "if not, "));
    const a = document.createElement("a");
    a.href = ev.url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "click here to log in";
    a.style.color = "inherit";
    div.appendChild(a);
  } else {
    div.textContent = ev.message || JSON.stringify(ev);
  }
  const c = $("console");
  const atBottom = c.scrollHeight - c.scrollTop - c.clientHeight < 40;
  c.appendChild(div);
  if (atBottom) c.scrollTop = c.scrollHeight;
}

function embedSrc(id) {
  // Cache-busting timestamp so the embed reloads with the playlist's current
  // tracks -- Spotify caches the embed, and reusing the same URL won't refresh.
  return "https://open.spotify.com/embed/playlist/" + id +
         "?utm_source=generator&t=" + Date.now();
}

function mountPlayer() {
  // Only mount the real embed once the playlist actually has a track --
  // an empty Spotify playlist embed renders as a broken-looking blank.
  if (playerMounted || !playlistId) return;
  $("playerWrap").innerHTML =
    '<iframe src="' + embedSrc(playlistId) + '" allow="encrypted-media" loading="lazy"></iframe>';
  playerMounted = true;
  $("refresh").disabled = false;
}

function refreshPlayer() {
  if (!playlistId) return;
  const f = document.querySelector("#playerWrap iframe");
  if (f) f.src = embedSrc(playlistId); // fresh timestamp forces a real reload
}

async function poll() {
  runDebug.polls++;
  const r = await fetch("/api/events?cursor=" + cursor + "&debug_cursor=" + serverDebug.cursor +
    (serverDebug.generation === null ? "" : "&generation=" + serverDebug.generation));
  const data = await r.json();
  cursor = data.cursor;
  serverDebug = {cursor: data.debug_cursor, generation: data.generation};
  printServerRecords(data.debug || []);
  if (window.debugVerbose) console.log("[playlist] poll", runDebug.polls, "status:", data.status,
    "events:", data.events.length, "server records:", (data.debug || []).length);
  let done = false;
  for (const ev of data.events) {
    line(ev);
    if (ev.kind === "playlist") {
      playlistId = ev.playlist_id;
      // Non-empty already (a re-run against an existing playlist) -> mount now.
      if (ev.track_count > 0) mountPlayer();
      else if (!playerMounted) renderPlayer("warming");
    }
    if (ev.kind === "reorder") showReorder(ev);
    // The server needs a Spotify login: open it here (the server can't reach a browser).
    if (ev.kind === "auth" && ev.url) window.open(ev.url, "_blank", "noopener");
    // A new add OR a duplicate both mean the playlist has at least one track.
    if (ev.kind === "added" || ev.kind === "duplicate") mountPlayer();
    if (ev.kind === "done") { done = true; setStatus(ev.status || "complete"); }
  }
  // Fallback if the playlist id only arrives at the top level.
  if (data.playlist_id && !playlistId) {
    playlistId = data.playlist_id;
    if (!playerMounted) renderPlayer("warming");
  }
  if (done) {
    debugSummary(data.status);
    finish();
    if (playerMounted) refreshPlayer();
    else renderPlayer(emptyState);
  } else {
    setStatus(data.status);
  }
}

function setRunning(running) {
  document.querySelectorAll(".go").forEach((b) => { b.disabled = running; });
  $("stop").disabled = !running;
}

function finish() {
  clearInterval(polling); polling = null;
  setRunning(false);
}

// Shared by both modes: reset the console/player, POST the run, start polling.
async function begin(url, body, emptyKey) {
  $("console").innerHTML = ""; cursor = 0; playlistId = null; playerMounted = false;
  emptyState = emptyKey;
  renderPlayer("idle"); $("refresh").disabled = true;
  setRunning(true);
  setStatus("running");
  debugStart(url, body);
  const r = await fetch(url, {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
  });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    console.error("[playlist] could not start:", r.status, e);
    line({kind:"error", message:"Could not start: " + (e.detail || r.status)});
    finish(); setStatus("error"); return;
  }
  polling = setInterval(poll, 400);
}

async function start() {
  const body = {
    query: $("query").value.trim(),
    title: $("title").value.trim() || null,
    threshold: parseFloat($("threshold").value),
    spotify: $("spotify").checked,
    saved: $("saved").checked,
    genius: $("genius").checked,
  };
  if (!body.query) { alert("Enter a search term first."); return; }
  await begin("/api/run", body, "empty");
}

async function startList(dryRun) {
  const body = {
    text: $("tracks").value,
    title: $("listTitle").value.trim() || null,
    dry_run: dryRun,
    known: known,   // loaded lines keep their exact track, no name search
  };
  if (!body.text.trim()) { alert("Paste some tracks first."); return; }
  if (!dryRun && !body.title) { alert("Give the playlist a title."); return; }
  await begin("/api/tracklist", body, "noPlaylist");
}

async function startReorder() {
  const text = $("tracks").value;
  if (!text.trim()) { alert("Paste some tracks first."); return; }
  collectTempos();
  $("needs").hidden = true;
  await begin("/api/reorder", {text: text, known: known, tempos: myTempos, keys: myKeys}, "noPlaylist");
}

// Read any tempos and keys typed into the panel and remember them.
function collectTempos() {
  document.querySelectorAll("#needsRows input").forEach((input) => {
    const bpm = parseFloat(input.value);
    if (bpm > 0) myTempos[tempoKey(input.dataset.line)] = bpm;
  });
  saveTempos(myTempos);
  document.querySelectorAll("#keyRows input").forEach((input) => {
    const id = tempoKey(input.dataset.line), text = input.value.trim();
    if (text) myKeys[id] = text; else delete myKeys[id];
  });
  saveKeys(myKeys);
}

// One row per track: its name and a key box (pre-filled with what you typed before).
function keyRow(line, note) {
  const row = document.createElement("div"); row.className = "need";
  const name = document.createElement("span"); name.className = "name"; name.textContent = line;
  const input = document.createElement("input");
  input.type = "text"; input.className = "key"; input.placeholder = "Key";
  input.value = myKeys[tempoKey(line)] || ""; input.dataset.line = line;
  row.append(name);
  if (note) { const why = document.createElement("span"); why.className = "why"; why.textContent = note; row.append(why); }
  row.append(input);
  return row;
}

// A reorder finished: put the new order in the box and ask about tracks that need a tempo.
function showReorder(ev) {
  beforeReorder = $("tracks").value;
  $("tracks").value = ev.text;
  Object.assign(known, ev.known || {});

  const rows = $("needsRows");
  rows.innerHTML = "";
  (ev.needs || []).forEach((need) => {
    const row = document.createElement("div"); row.className = "need";
    const name = document.createElement("span"); name.className = "name"; name.textContent = need.line;
    const why = document.createElement("span"); why.className = "why"; why.textContent = need.flag;
    const input = document.createElement("input");
    input.type = "number"; input.min = "30"; input.max = "300"; input.placeholder = "BPM";
    input.dataset.line = need.line;
    row.append(name, why);
    (need.readings || []).forEach((bpm) => {
      const pick = document.createElement("button");
      pick.className = "pick"; pick.textContent = "use " + bpm;
      pick.onclick = () => { input.value = bpm; };
      row.append(pick);
    });
    row.append(input);
    rows.append(row);
  });

  const keyRows = $("keyRows");
  keyRows.innerHTML = "";
  const noKey = ev.no_key || [], typed = ev.typed_keys || {};
  Object.keys(typed).forEach((line) => keyRows.append(keyRow(line, "yours: " + typed[line])));
  noKey.forEach((line) => keyRows.append(keyRow(line, "")));
  $("keysTitle").textContent = noKey.length
    ? noKey.length + " track(s) have no key. Add any you know (8A, A minor, Am...), then reorder again."
    : "Every track has a key.";
  $("keysTitle").hidden = !(noKey.length || Object.keys(typed).length);

  const count = (ev.needs || []).length;
  const savedTempos = Object.keys(myTempos).length, savedKeys = Object.keys(myKeys).length;
  $("needsTitle").textContent = count
    ? count + " track(s) need a tempo from you. Enter it, then reorder again."
    : "Every track has a tempo.";
  $("applyTempos").hidden = !(count || noKey.length || Object.keys(typed).length);
  $("forgetTempos").hidden = !(savedTempos || savedKeys);
  const remembered = [];
  if (savedTempos) remembered.push(savedTempos + " tempo(s)");
  if (savedKeys) remembered.push(savedKeys + " key(s)");
  $("temposNote").textContent = remembered.length
    ? remembered.join(" and ") + " you entered are remembered in this browser." : "";
  $("needs").hidden = false;
}

function undoReorder() {
  if (beforeReorder !== null) $("tracks").value = beforeReorder;
  $("needs").hidden = true;
}

function forgetTempos() {
  myTempos = {}; saveTempos(myTempos);
  myKeys = {}; saveKeys(myKeys);
  $("forgetTempos").hidden = true;
  $("temposNote").textContent = "Cleared. Reorder again to see the effect.";
}

// Pull an existing playlist's tracks into the box (appended, never overwriting).
async function loadPlaylist() {
  const link = $("sourceLink").value.trim();
  if (!link) { alert("Paste a playlist link first."); return; }
  $("loadList").disabled = true;
  try {
    console.log("[playlist] load tracks: POST /api/playlist-tracks", {link: link});
    const r = await fetch("/api/playlist-tracks", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({link}),
    });
    const data = await r.json().catch(() => ({}));
    console.log("[playlist] load tracks: response", r.status, data);
    if (data.tracks) console.table(data.tracks);
    if (!r.ok) {
      line({kind:"error", message:"Could not load that playlist: " + (data.detail || r.status)});
      return;
    }
    data.tracks.forEach((t) => { if (t.id) known[t.line] = t.id; });
    const box = $("tracks");
    const existing = box.value.replace(/\s+$/, "");
    box.value = (existing ? existing + "\n" : "") + data.tracks.map((t) => t.line).join("\n");
    line({kind:"summary", message:"Loaded " + data.tracks.length + " track(s) from \""
                                   + data.name + "\" into the box. Reorder them, then create."});
  } catch (err) {
    line({kind:"error", message:"Could not load that playlist: " + err});
  } finally {
    $("loadList").disabled = false;
  }
}

function setMode(mode) {
  const list = mode === "list";
  $("searchControls").hidden = list;
  $("listControls").hidden = !list;
  $("modeSearch").classList.toggle("active", !list);
  $("modeList").classList.toggle("active", list);
}

async function stop() {
  $("stop").disabled = true;
  await fetch("/api/stop", {method: "POST"});
}

$("start").onclick = start;
$("createList").onclick = () => startList(false);
$("checkList").onclick = () => startList(true);
$("reorderList").onclick = startReorder;
$("applyTempos").onclick = startReorder;
$("undoReorder").onclick = undoReorder;
$("forgetTempos").onclick = forgetTempos;
$("loadList").onclick = loadPlaylist;
$("sourceLink").addEventListener("keydown", (e) => { if (e.key === "Enter") loadPlaylist(); });
$("modeSearch").onclick = () => setMode("search");
$("modeList").onclick = () => setMode("list");
$("stop").onclick = stop;
$("refresh").onclick = refreshPlayer;
$("query").addEventListener("keydown", (e) => { if (e.key === "Enter") start(); });

renderPlayer("idle");  // cold-start state on first load
</script>
</body>
</html>
